# momenti — API + uploaded media + built SPA in one container.
#
# Served exclusively through the existing cloudflared tunnel on jdp-network:
# point the tunnel ingress at   http://momenti:8000
# (service name = DNS name on the shared docker network).
#
# Runtime state (SQLite DB, uploaded media, token-signing secret) lives in
# ./server/data on the host — gitignored, survives rebuilds, and is the same
# directory the legacy Node backend used, so `import_momenti_json` finds
# db.json without any copying.
services:
  momenti:
    build: .
    image: momenti:latest
    container_name: momenti
    restart: unless-stopped
    networks:
      - jdp-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOMENTI_DEBUG: "${MOMENTI_DEBUG:-off}"                 # keep "off" in prod
      MOMENTI_DATA_DIR: /data                                # volume-mounted below
      MOMENTI_DIST_DIR: /app/dist                            # Django serves the built SPA
      MOMENTI_DEV_HELPERS: "${MOMENTI_DEV_HELPERS:-off}"     # keep "off" in prod
      # cloudflared forwards the original public hostname as the Host header —
      # it MUST be in ALLOWED_HOSTS or Django answers every request with 400
      # (DisallowedHost). Override via .env / shell env without editing here:
      MOMENTI_ALLOWED_HOSTS: "${MOMENTI_ALLOWED_HOSTS:-momenti.jdp-homelab.space,momenti,localhost,127.0.0.1}"
      # Origin used in password-reset links and CSRF checks for the admin:
      MOMENTI_PUBLIC_ORIGIN: "${MOMENTI_PUBLIC_ORIGIN:-https://momenti.jdp-homelab.space}"
      MOMENTI_CSRF_TRUSTED_ORIGINS: "${MOMENTI_CSRF_TRUSTED_ORIGINS:-https://momenti.jdp-homelab.space}"
      # Empty => the app generates a signing key on first boot and persists it
      # in /data. Pin via .env for multi-replica setups:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      # Keep-alive must sit above Cloudflare's connection idle-reuse window.
      # Gunicorn's 2s default closes idle connections the tunnel still wants
      # to reuse — POSTs can't be retried, so they surface as random 502s.
      GUNICORN_KEEPALIVE: "${GUNICORN_KEEPALIVE:-75}"
      # Database: SQLite by default; set MOMENTI_DB_ENGINE=postgres (and
      # start the bundled postgres service) for the SaaS posture.
      MOMENTI_DB_ENGINE: "${MOMENTI_DB_ENGINE:-sqlite}"
      MOMENTI_DB_HOST: postgres
      MOMENTI_DB_NAME: "${MOMENTI_DB_NAME:-momenti}"
      MOMENTI_DB_USER: "${MOMENTI_DB_USER:-momenti}"
      MOMENTI_DB_PASSWORD: "${MOMENTI_DB_PASSWORD:-momenti-change-me}"
      # Optional email delivery for verification codes / reset links. When
      # MOMENTI_EMAIL_HOST is set, mail goes out over SMTP and the dev
      # helpers disappear; leave unset to keep dev helpers:
      MOMENTI_EMAIL_HOST: "${MOMENTI_EMAIL_HOST:-}"
      MOMENTI_EMAIL_PORT: "${MOMENTI_EMAIL_PORT:-587}"
      MOMENTI_EMAIL_USER: "${MOMENTI_EMAIL_USER:-}"
      MOMENTI_EMAIL_PASSWORD: "${MOMENTI_EMAIL_PASSWORD:-}"
      MOMENTI_EMAIL_FROM: "${MOMENTI_EMAIL_FROM:-}"
      MOMENTI_EMAIL_USE_TLS: "${MOMENTI_EMAIL_USE_TLS:-true}"
      MOMENTI_EMAIL_USE_SSL: "${MOMENTI_EMAIL_USE_SSL:-false}"
      # SaaS billing (Phase 2): enforce plan limits (Free = 1 invitation / 200 MB);
      # the manual-activation admin toggle is the pre-PayMongo grant path.
      MOMENTI_QUOTA_ENFORCEMENT: "${MOMENTI_QUOTA_ENFORCEMENT:-on}"
      MOMENTI_BILLING_MANUAL_ACTIVATION: "${MOMENTI_BILLING_MANUAL_ACTIVATION:-on}"
      # Optional Pro plan monthly price override in centavos (₱499.00 = 49900),
      # applied to the seeded plan at boot. Leave unset to manage via /admin.
      MOMENTI_PRO_PRICE_CENTS: "${MOMENTI_PRO_PRICE_CENTS:-}"
      # PayMongo checkout + webhook (SaaS Phase 3). Set MOMENTI_PAYMONGO_SECRET_KEY
      # to enable paid-plan checkout on /studio/billing; the webhook secret must
      # match the one PayMongo shows for the /api/billing/webhook endpoint.
      MOMENTI_PAYMONGO_SECRET_KEY: "${MOMENTI_PAYMONGO_SECRET_KEY:-}"
      MOMENTI_PAYMONGO_WEBHOOK_SECRET: "${MOMENTI_PAYMONGO_WEBHOOK_SECRET:-}"
      MOMENTI_PAYMONGO_MODE: "${MOMENTI_PAYMONGO_MODE:-test}"
      # Payment methods offered at checkout. New PayMongo accounts start with
      # GCash/Maya only — drop "card" until card payments are activated.
      MOMENTI_PAYMONGO_METHODS: "${MOMENTI_PAYMONGO_METHODS:-gcash,paymaya,card}"
      # Checkout flow: "hosted" (default — PayMongo's checkout page) or "qrph"
      # (scannable QR Ph code rendered on the Billing page itself).
      MOMENTI_PAYMONGO_FLOW: "${MOMENTI_PAYMONGO_FLOW:-hosted}"
      # Per-IP throttling for public endpoints (register/login/otp/reset/rsvp).
      # Adjust for traffic; the defaults blunt email-bombing and RSVP spam.
      MOMENTI_THROTTLE_ANON: "${MOMENTI_THROTTLE_ANON:-20/minute}"
      MOMENTI_THROTTLE_USER: "${MOMENTI_THROTTLE_USER:-60/minute}"
      MOMENTI_THROTTLE_LOGIN: "${MOMENTI_THROTTLE_LOGIN:-10/minute}"
      MOMENTI_THROTTLE_OTP: "${MOMENTI_THROTTLE_OTP:-5/minute}"
      MOMENTI_THROTTLE_RSVP: "${MOMENTI_THROTTLE_RSVP:-10/minute}"
      # Optional legal page URLs (blank = links hide in the SPA footer).
      MOMENTI_TERMS_URL: "${MOMENTI_TERMS_URL:-}"
      MOMENTI_PRIVACY_URL: "${MOMENTI_PRIVACY_URL:-}"
      # Business/marketing info served via /api/app/settings for the public pages.
      MOMENTI_BUSINESS_NAME: "${MOMENTI_BUSINESS_NAME:-}"
      MOMENTI_BUSINESS_TAGLINE: "${MOMENTI_BUSINESS_TAGLINE:-}"
      MOMENTI_BUSINESS_CONTACT_EMAIL: "${MOMENTI_BUSINESS_CONTACT_EMAIL:-}"
      MOMENTI_BUSINESS_LOCATIONS: "${MOMENTI_BUSINESS_LOCATIONS:-}"
      MOMENTI_BUSINESS_SOCIALS: "${MOMENTI_BUSINESS_SOCIALS:-}"
      MOMENTI_HERO_SAMPLE_LINK: "${MOMENTI_HERO_SAMPLE_LINK:-}"
      # White-label branding: env values are the defaults; the Admin console's
      # White-label tab stores DB overrides on top of these (migration 0011).
      MOMENTI_BRAND_ACCENT_COLOR: "${MOMENTI_BRAND_ACCENT_COLOR:-}"
      MOMENTI_BRAND_ACCENT_HOVER_COLOR: "${MOMENTI_BRAND_ACCENT_HOVER_COLOR:-}"
      MOMENTI_BRAND_LOGO_URL: "${MOMENTI_BRAND_LOGO_URL:-}"
      MOMENTI_BRAND_FAVICON_URL: "${MOMENTI_BRAND_FAVICON_URL:-}"
    volumes:
      - ./server/data:/data
    # The tunnel is the only ingress — no host ports. Uncomment to poke at it
    # from the host machine while testing:
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${MOMENTI_DB_NAME:-momenti}"
      POSTGRES_USER: "${MOMENTI_DB_USER:-momenti}"
      POSTGRES_PASSWORD: "${MOMENTI_DB_PASSWORD:-momenti-change-me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jdp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOMENTI_DB_USER:-momenti} -d ${MOMENTI_DB_NAME:-momenti}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  jdp-network:
    external: true
